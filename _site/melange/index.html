  <script>
    (function() {
      var stored = localStorage.getItem('theme');
      var preferred = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (preferred === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

    </svg>
  </button>

  <main><style>
.mel { max-width: 620px; margin: 0 auto; padding: 3.5rem var(--page-padding) 4rem; }

}

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>
